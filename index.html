<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetHub.io — Institutional Spreadsheet OS, Quant Models & Sheet-to-API Engine</title>
    <meta name="description" content="Deploy institutional-grade Google Sheets & Excel operating systems, automated arbitrage trackers, quantitative financial models, and REST API spreadsheet pipelines.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#03060C',
                        panel: '#090F1E',
                        emerald: {
                            450: '#10B981',
                            550: '#059669'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #03060c;
            --accent-emerald: #10b981;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: #f8fafc;
            overflow-x: hidden;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050811;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        /* Advanced Glassmorphism & Glows */
        .glass-ultra {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.78) 0%, rgba(9, 13, 24, 0.88) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.65) 0%, rgba(7, 11, 20, 0.9) 100%);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(51, 65, 85, 0.45);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(16, 185, 129, 0.55);
            box-shadow: 0 24px 48px -12px rgba(16, 185, 129, 0.18), inset 0 1px 1px rgba(16, 185, 129, 0.25);
        }
        .neon-border-emerald {
            box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.35), inset 0 0 20px -10px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }
        .aurora-blur {
            position: absolute;
            filter: blur(130px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }
        /* Grid Matrix Overlay */
        .quantum-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        /* Infinite Ticker Tape */
        @keyframes tickerMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-track {
            display: flex;
            width: max-content;
            animation: tickerMove 38s linear infinite;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }
        /* Spreadsheet Cell Styling */
        .sheet-cell {
            border-right: 1px solid rgba(51, 65, 85, 0.4);
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            padding: 8px 12px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            transition: background 0.15s ease;
        }
        .sheet-cell:hover {
            background: rgba(16, 185, 129, 0.08);
        }
        .sheet-header-cell {
            background: rgba(15, 23, 42, 0.95);
            color: #94a3b8;
            font-weight: 600;
            text-align: center;
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            border-bottom: 1px solid rgba(51, 65, 85, 0.6);
            padding: 6px 10px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }
        /* Range Slider Custom */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            background: #1e293b;
            height: 6px;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #10b981;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.9);
            border: 2px solid #ffffff;
        }
        /* Shimmer Text */
        .text-gradient-pro {
            background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 45%, #34d399 75%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

    <!-- BACKGROUND INTERACTIVE PARTICLE CANVAS -->
    <canvas id="quantumCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- AMBIENT AURORA LIGHTS -->
    <div class="aurora-blur w-[550px] h-[550px] rounded-full bg-emerald-500/20 -top-48 -left-32"></div>
